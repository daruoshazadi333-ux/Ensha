<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>زنگ املا 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Noto+Naskh+Arabic:wght@400;700&family=Vazirmatn:wght@400;700&family=Cairo:wght@400;700&display=swap" rel="stylesheet"><style>
:root{color-scheme:light;--hl:#ffd54f;--er:#ef9a9a;--pp:#fff8e1;--ft:Tahoma,sans-serif;--sl:#2b3a5c;--sl2:#3d5080;padding-top:env(safe-area-inset-top,0px);box-sizing:border-box}
.txt,.board,.bub,.sp p{font-family:var(--ft)!important}
.w.ok{background:var(--hl)!important;color:#000!important;font-weight:900!important;box-shadow:0 0 0 3px var(--hlb,#e65100);border-radius:8px}
.w.no{background:var(--er)!important;color:var(--ert,#fff)!important;text-decoration:line-through;opacity:.9;box-shadow:0 0 0 3px var(--erb,#c62828);border-radius:8px}
.w.hint{outline:3px dashed #f57c00!important;background:#fff3e0!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#b58a5a;font-family:var(--ft),Tahoma,sans-serif;color:#222;font-weight:600;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea{ -webkit-user-select:text!important;user-select:text!important;-webkit-touch-callout:default}
.bg{position:fixed;inset:-4%;width:108%;height:108%;z-index:-1;filter:blur(5px)}
body::after{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(#0000 45%,#0005)}
#app{max-width:520px;margin:auto;padding:10px 12px 110px;min-height:100vh}
.tb{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.coin{display:flex;align-items:center;gap:8px;background:var(--sl);color:#fff;border-radius:30px;padding:4px 16px 4px 6px;font-weight:900;font-size:19px;box-shadow:0 4px 0 #0004,inset 0 2px 0 #fff3}
.coin i{width:34px;height:34px;border-radius:50%;background:radial-gradient(#ffe45c,#f5a300);border:3px solid #ffd54a;color:#a55b00;display:grid;place-items:center;font-style:normal;font-size:18px;font-weight:900}
.ttl{flex:1;text-align:center;color:#fff;font-size:27px;font-weight:900;text-shadow:0 3px 0 #0006;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mn{width:52px;height:52px;border-radius:16px;border:0;background:var(--sl);box-shadow:0 4px 0 #0004,inset 0 2px 0 #fff3;display:grid;place-items:center;cursor:pointer;padding:0}
.pill{position:relative;width:62%;margin:0 auto 12px;height:38px;border-radius:20px;background:var(--sl);overflow:hidden;box-shadow:0 4px 0 #0004;color:#fff;display:grid;place-items:center;font-weight:900;text-shadow:0 2px 0 #0006}
.pill i{position:absolute;top:0;bottom:0;right:0;background:linear-gradient(#6fdc5f,#2e9e3a);transition:width .5s}.pill b{position:relative}
.board{position:relative;background:linear-gradient(135deg,#2f6b57,#1f4f3f);border:9px solid #b97f45;border-radius:10px;box-shadow:0 0 0 3px #8a5a2b,0 8px 0 #0003,inset 0 0 30px #0006;color:#fff;text-align:center;padding:16px 10px;margin:8px 0 22px;font-size:22px;font-weight:900;text-shadow:0 2px 0 #0004}
.board h1{margin:6px 0;font-size:48px;font-weight:900}.board::after{content:'';position:absolute;left:18px;bottom:-20px;width:64px;height:14px;background:linear-gradient(#e8ddc4,#c9b98f);border-radius:4px;box-shadow:0 3px 0 #0003}
.btn{position:relative;overflow:hidden;display:block;width:100%;padding:16px;margin:10px 0;border:0;border-radius:22px;font:inherit;font-size:22px;font-weight:900;color:#fff;text-shadow:0 2px 0 #0005;box-shadow:0 7px 0 rgba(0,0,0,.3),inset 0 3px 0 #fff6;cursor:pointer;transition:transform .1s}
.btn::before{content:'';position:absolute;inset:0 0 55% 0;background:linear-gradient(#fff5,#fff0);pointer-events:none}
.btn:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.3),inset 0 3px 0 #fff6}
.btn[style*="#e3e9f4"]{color:var(--sl);text-shadow:none}
.g4{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:40px}.g4 .btn{height:94px;font-size:27px;padding:0}
.sm{background:#e5484d;color:#fff;border:0;border-radius:14px;padding:8px 14px;font:inherit;font-weight:900;box-shadow:0 3px 0 #0004;cursor:pointer}
.card{background:#fdfaf3;border-radius:22px;padding:14px;margin:10px 0;box-shadow:0 5px 0 #0003;border:3px solid #fff;animation:pop .3s}
.row{display:flex;gap:10px;align-items:center}
.sp{flex:1}.nm{display:inline-block;background:var(--sl);color:#fff;border-radius:12px;padding:2px 12px;font-size:14px;font-weight:900;margin-bottom:5px}
.sp p{background:#eef2fa;border-radius:6px 18px 18px 18px;padding:9px 13px;margin:0;font-weight:700;line-height:1.9}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#fff;margin:8px 0;font-weight:900}
.top>span{background:var(--sl);border-radius:18px;padding:6px 14px;box-shadow:0 3px 0 #0004}.top>span:empty{display:none}
.g{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.lv{display:flex;align-items:center;aspect-ratio:1;border:0;border-radius:16px;background:linear-gradient(#fff,#dfe6f2);color:var(--sl);font:inherit;font-weight:900;font-size:19px;box-shadow:0 5px 0 #0003;cursor:pointer}.lv.x{background:linear-gradient(#ffe27a,#ffc928)}.lv.t{background:linear-gradient(#ffb48a,#ff8a4c)}.lv.z{background:linear-gradient(#fff2a0,#f5b800)}.lv.d{background:linear-gradient(#9ae67f,#4cc13a);color:#fff}.lv:disabled{background:#6f7f9c;color:#fff9;box-shadow:0 3px 0 #0003}
.txt{background:var(--pp);border:6px solid #b97f45;border-radius:16px;box-shadow:0 5px 0 #0003;padding:14px;line-height:2.5;font-size:21px;margin:10px 0}
.w{padding:2px 4px;border-radius:8px;transition:.2s;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.w.tap{cursor:pointer;padding:3px 6px}.w.plain{cursor:default}
.txt{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.txt *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.w.ok{background:var(--hl)!important;color:#000!important;font-weight:900!important;box-shadow:0 0 0 3px var(--hlb,#e65100)}.w.no{background:var(--er)!important;color:var(--ert,#fff)!important;text-decoration:line-through;box-shadow:0 0 0 3px var(--erb,#c62828)}.w.hint{outline:3px dashed #f57c00!important;background:#fff3e0}
.bub{flex:1;background:#fdfaf3;border-radius:6px 18px 18px 18px;padding:9px 13px;min-height:44px;font-weight:800;box-shadow:0 3px 0 #0003}
.cheat{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:auto;padding:12px 20px;background:#ff7043;z-index:3;font-size:19px}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:auto;height:76px;display:flex;align-items:flex-end;background:var(--sl);border-radius:28px 28px 0 0;padding:0 6px env(safe-area-inset-bottom,0px);box-shadow:0 -4px 0 #0003}
.nav button{flex:1;height:62px;border:0;background:none;color:#fff;font:inherit;font-size:19px;font-weight:900;border-radius:22px 22px 0 0;cursor:pointer;text-shadow:0 2px 0 #0005}
.nav button.on{background:var(--sl2);transform:translateY(-14px);height:82px;border-radius:36px 36px 0 0;box-shadow:0 -4px 0 #0003;font-size:22px}
.av{animation:bob 3s ease-in-out infinite}.ey{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}.mb .mt{transform-box:fill-box;transform-origin:center;animation:talk .35s infinite alternate}
.avw,#ja{flex:none;display:block}.happy{animation:jump .6s 3}.angry{animation:shake .45s 4}
@keyframes bob{50%{transform:translateY(-2px)}}@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}@keyframes talk{to{transform:scaleY(.55)}}@keyframes jump{30%{transform:translateY(-14px) rotate(-6deg)}60%{transform:translateY(0) rotate(6deg)}}@keyframes shake{25%{transform:translateX(-6px) rotate(-4deg)}75%{transform:translateX(6px) rotate(4deg)}}
.wm{position:fixed;left:14px;bottom:96px;color:#ffffffb0;font-size:13px;transform:rotate(-8deg);pointer-events:none;font-family:sans-serif;text-shadow:0 1px 2px #0008}
#ov{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9;padding:16px}.mb{background:#fdfaf3;border:4px solid var(--sl);border-radius:26px;padding:16px;width:100%;max-width:420px;animation:pop .25s;max-height:92vh;overflow:auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.it{border:3px solid #ddd;border-radius:18px;padding:10px;font:inherit;background:#fff;color:#222!important;font-weight:700;box-shadow:0 4px 0 #0002;cursor:pointer}button{color:#222}
.wh{position:relative;width:200px;height:200px;margin:18px auto}#wh{position:absolute;inset:0;border-radius:50%;border:6px solid #5d4037;transition:transform 3s cubic-bezier(.2,.8,.2,1)}#wh b{position:absolute;top:50%;left:50%;font-size:14px}.pt{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:24px;color:#d32f2f}
.fade{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;background:#102a43;animation:fio 2.4s forwards;font-size:32px;z-index:20}
.cf{position:fixed;top:-30px;font-size:28px;animation:fall 3s linear forwards;z-index:30}
.flex{display:flex;direction:ltr;flex-wrap:wrap;gap:8px}.flex>div{direction:rtl;flex:1 1 220px}
@keyframes pop{from{transform:scale(.9);opacity:0}}@keyframes fio{0%{opacity:0}30%,70%{opacity:1}100%{opacity:0}}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@keyframes stampIn{0%{transform:scale(2.4) rotate(-20deg);opacity:0}60%{transform:scale(.9) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(-6deg)}}
@keyframes stampHit{0%{transform:scale(1.8) rotate(12deg);opacity:0}40%{transform:scale(1.05) rotate(-8deg)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}100%{transform:scale(1) rotate(-6deg);opacity:1}}
.stamp-ok{animation:stampIn .55s ease-out forwards}
.stamp-bad{animation:stampHit .65s ease-out forwards}

const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]),$=s=>{try{return document.querySelector(s)}catch(e){return null}},H=s=>{const a=document.getElementById('app')||document.querySelector('#app');if(a)a.innerHTML=s;else console.error('no #app');};
// ===== موتور صدا (WebAudio — بدون فایل خارجی، کاملاً آفلاین) =====
const SND=(()=>{
  const KEY='zangEmlaSnd';
  const P={m:1,s:1};
  try{Object.assign(P,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
  const keep=()=>{try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}};
  let ctx=null,comp,master,mG,sG,nb,cur=null,tid=null,nextT=0,si=0,want='menu',urg=0,busy=0,aft=0,btn=null,primed=0;
  const mid=n=>440*Math.pow(2,(n-69)/12);
  const run=()=>!!ctx&&ctx.state==='running';

  function init(){
    if(ctx)return ctx;
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return null;
    try{
      ctx=new AC();
      comp=ctx.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;
      master=ctx.createGain();master.gain.value=.9;
      mG=ctx.createGain();sG=ctx.createGain();
      mG.connect(comp);sG.connect(comp);comp.connect(master);master.connect(ctx.destination);
      nb=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);
      const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      vol();
    }catch(e){console.error('audio init',e);ctx=null}
    return ctx;
  }
  function vol(){
    if(!ctx)return;
    const t=ctx.currentTime;
    mG.gain.setTargetAtTime(P.m?.3:0,t,.05);
    sG.gain.setTargetAtTime(P.s?.9:0,t,.02);
  }

  // ---- سازه‌های پایه ----
  function tone(f,t,d,o){
    o=o||{};
    const os=ctx.createOscillator(),g=ctx.createGain();
    os.type=o.type||'sine';
    os.frequency.setValueAtTime(f,t);
    if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+d);
    const v=o.v==null?.25:o.v,a=o.a==null?.008:o.a;
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(v,t+Math.min(a,d*.5));
    g.gain.exponentialRampToValueAtTime(.0001,t+d);
    if(o.vib){
      const l=ctx.createOscillator(),lg=ctx.createGain();
      l.frequency.value=5.5;lg.gain.value=o.vib;l.connect(lg);lg.connect(os.detune);
      l.start(t);l.stop(t+d+.05);
    }
    os.connect(g);
    let out=g;
    if(o.lp){const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=o.lp;g.connect(lp);out=lp}
    out.connect(o.dest||sG);
    os.start(t);os.stop(t+d+.05);
  }
  function noise(t,d,o){
    o=o||{};
    const s=ctx.createBufferSource();s.buffer=nb;s.loop=true;
    const f=ctx.createBiquadFilter();f.type=o.type||'highpass';f.frequency.value=o.f||6000;if(o.q)f.Q.value=o.q;
    const g=ctx.createGain();
    g.gain.setValueAtTime(o.v==null?.2:o.v,t);
    g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(f);f.connect(g);g.connect(o.dest||sG);
    s.start(t,Math.random()*.5);s.stop(t+d+.02);
  }
  // زنگ مدرسه: چکش که تند تند به زنگ فلزی می‌خوره
  function ring(t,d){
    const R=[1,1.52,2.1,2.74,3.6,4.3],F=720;
    for(let k=0,n=Math.floor(d*13);k<n;k++){
      const tk=t+k/13+(Math.random()*.012),amp=.9+Math.random()*.2;
      noise(tk,.025,{type:'bandpass',f:3500,q:.8,v:.22*amp});
      R.forEach((r,i)=>tone(F*r,tk,.3/(1+i*.35),{type:'sine',v:(.2/(1+i*.5))*amp,a:.002}));
    }
    // آخرش یک «دنگ» بلند
    R.slice(0,4).forEach((r,i)=>tone(F*r*.5,t+d,.9/(1+i*.4),{type:'sine',v:.14/(1+i*.5),a:.003}));
  }
  // تشویق جمعیت
  function clap(t,d,v){
    for(let i=0;i<d*28;i++)noise(t+Math.random()*d,.05,{type:'bandpass',f:1500+Math.random()*1800,q:.8,v:v});
  }

  // ---- افکت‌ها ----
  const FX={
    click:T=>tone(1400,T,.04,{type:'triangle',v:.1,to:900}),
    pop:T=>tone(480,T,.09,{v:.1,to:880}),
    // پیدا کردن غلط درست: هرچه پشت‌سرهم بیشتر، زیرتر
    ok:(T,c)=>{
      const b=72+Math.min(Math.max((c|0)-1,0),7);
      tone(mid(b),T,.14,{type:'triangle',v:.26});
      tone(mid(b+7),T+.09,.28,{type:'triangle',v:.26});
      tone(mid(b+19),T+.09,.3,{v:.06});
    },
    bad:T=>{
      tone(190,T,.3,{type:'sawtooth',v:.2,to:85,lp:900});
      tone(140,T,.3,{type:'square',v:.08,to:70,lp:700});
    },
    lowlife:T=>{
      tone(660,T,.09,{type:'square',v:.1,lp:2500});
      tone(660,T+.17,.09,{type:'square',v:.1,lp:2500});
    },
    tick:(T,hi)=>{
      tone(hi?2200:1700,T,.035,{type:'square',v:.09,lp:4000});
      noise(T,.02,{type:'bandpass',f:3000,v:.1});
    },
    warn:T=>{
      tone(988,T,.12,{type:'square',v:.12,lp:3000});
      tone(784,T+.15,.14,{type:'square',v:.12,lp:3000});
    },
    bell:(T,n)=>ring(T,n>1?1.8:1.1),
    win:T=>{
      [[72,0],[76,.1],[79,.2],[84,.3]].forEach(a=>{
        tone(mid(a[0]),T+a[1],.16,{type:'square',v:.1,lp:3500});
        tone(mid(a[0]),T+a[1],.2,{type:'triangle',v:.2});
      });
      [84,88,91].forEach(n=>{
        tone(mid(n),T+.5,.9,{type:'triangle',v:.2,a:.02});
        tone(mid(n-12),T+.5,.9,{v:.1});
      });
      noise(T+.5,.7,{f:6000,v:.1});
    },
    winBig:T=>{
      FX.win(T);
      [[88,.95],[91,1.1],[96,1.25]].forEach(a=>tone(mid(a[0]),T+a[1],.5,{type:'triangle',v:.2}));
      clap(T+.7,1.6,.06);
    },
    lose:T=>{
      [[233,0,.34],[220,.38,.34],[208,.76,.34],[196,1.14,.9]].forEach((a,i)=>
        tone(a[0],T+a[1],a[2],{type:'sawtooth',v:.2,lp:1100,a:.03,to:i===3?185:0,vib:i===3?30:0}));
      tone(98,T+1.14,.9,{type:'triangle',v:.12,vib:20});
    },
    timeup:T=>{ring(T,1.4);FX.lose(T+2.4)},
    coin:T=>{
      tone(mid(83),T,.07,{type:'square',v:.09,lp:4000});
      tone(mid(88),T+.07,.35,{type:'square',v:.09,lp:4000});
    },
    record:T=>{
      [72,76,79,84,88].forEach((n,i)=>tone(mid(n),T+i*.08,.3,{type:'triangle',v:.2}));
      tone(mid(96),T+.45,.6,{v:.1});
    },
    medal:T=>{
      [[67,0,.14],[67,.17,.14],[67,.34,.14],[72,.51,.8]].forEach(a=>{
        tone(mid(a[0]),T+a[1],a[2],{type:'sawtooth',v:.13,lp:2800,a:.02});
        tone(mid(a[0]+12),T+a[1],a[2],{type:'triangle',v:.12});
      });
      noise(T+.51,.6,{f:7000,v:.08});
    },
    gift:T=>{[84,88,91,96,100].forEach((n,i)=>tone(mid(n),T+i*.07,.35,{v:.12}))},
    safe:T=>tone(420,T,.32,{v:.14,to:960}),
    error:T=>{
      tone(220,T,.14,{type:'square',v:.1,lp:1800});
      tone(165,T+.15,.2,{type:'square',v:.1,lp:1800});
    },
    sneaky:T=>{[57,58,60,61,63,64].forEach((n,i)=>tone(mid(n),T+i*.13,.1,{type:'triangle',v:.22}))},
    hint:T=>{tone(mid(96),T,.2,{v:.1});tone(mid(103),T+.1,.3,{v:.1})},
    caught:T=>{
      for(let k=0;k<2;k++){
        tone(650,T+k*.45,.22,{type:'sawtooth',v:.1,to:1050,lp:2500});
        tone(1050,T+k*.45+.22,.22,{type:'sawtooth',v:.1,to:650,lp:2500});
      }
      [[41,.95,.35],[41,1.35,.35],[38,1.75,1]].forEach(a=>{
        tone(mid(a[0]),T+a[1],a[2],{type:'sawtooth',v:.2,lp:900});
        tone(mid(a[0]-12),T+a[1],a[2],{v:.2});
      });
    },
    stamp:T=>{tone(130,T,.2,{v:.5,to:45});noise(T,.12,{type:'lowpass',f:900,v:.35})},
    stampbad:T=>{
      tone(110,T,.28,{v:.5,to:40});
      noise(T,.14,{type:'lowpass',f:700,v:.35});
      tone(mid(45),T+.2,.5,{type:'sawtooth',v:.1,lp:600});
    },
    buy:T=>{
      noise(T,.05,{f:4500,v:.18});
      tone(mid(91),T+.05,.12,{type:'triangle',v:.2});
      tone(mid(96),T+.15,.45,{type:'triangle',v:.2});
    },
    eat:T=>{
      for(let i=0;i<4;i++)noise(T+i*.11,.06,{type:'bandpass',f:1300+Math.random()*600,q:1.2,v:.35});
      tone(300,T+.55,.18,{v:.2,to:120});
    },
    confetti:T=>{
      noise(T,.12,{f:1000,v:.3});
      tone(mid(84),T,.25,{type:'triangle',v:.12,to:mid(96)});
    }
  };
  const LEN={win:2.2,winBig:2.8,lose:2.1,timeup:4.4,caught:3};

  function sfx(n,a,delay){
    if(!P.s||!run())return;
    const f=FX[n];if(!f)return;
    try{f(ctx.currentTime+(delay||0)+.01,a)}catch(e){console.error('sfx',n,e)}
    if(n==='bad'||n==='caught'||n==='lose'||n==='timeup'){
      try{navigator.vibrate&&navigator.vibrate(n==='bad'?[70,40,70]:[160,60,160])}catch(e){}
    }
  }
  // صدای بلند و مهم: چیزهای دیگر تا تمام شدنش صبر می‌کنن
  function big(n){
    if(!P.s||!run())return;
    busy=ctx.currentTime+(LEN[n]||2);
    sfx(n);
  }
  // صدای حرف زدن شخصیت‌ها (هر شخصیت یک زیر و بمی)
  function talk(c,m,t){
    if(!P.s||!run())return;
    c=String(c||'');

    if(p===4||p===12)ch.slice(0,3).forEach(n=>tone(mid(n),t,d*2.2,{type:'square',v:.035,lp:1600,dest:g}));
    if(p%2===1)tone(mid(ch[[0,1,2,1][(p>>1)%4]]+12),t,d*1.6,{v:.07,dest:g});

  const AP=[0,3,6,8,10,13],AN=[0,1,2,1,2,0];

})();

function toEnDigits(s){
  return String(s||'')
    .replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));

function normalizeCode(raw){
  let s=toEnDigits(raw).toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(s.startsWith('ZE'))s=s.slice(2);
  if(!s)return '';
  return 'ZE-'+s;
}
function genAccountCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c='ZE-';
  for(let i=0;i<6;i++)c+=chars[Math.random()*chars.length|0];
  const map=loadAccounts();
  if(map[c]||map[normalizeCode(c)])return genAccountCode();
  return c;
}

function findAccount(raw){
  const code=normalizeCode(raw);
  if(!code)return null;
  const map=loadAccounts();
  // 1) کلید دقیق
  if(map[code]&&map[code].name)return {code,acc:map[code]};
  // 2) همه کلیدها نرمال‌شده
  for(const k of Object.keys(map)){
    if(normalizeCode(k)===code&&map[k]&&map[k].name){
      return {code,acc:map[k]};
    }
  }
  // 3) فقط بخش بعد از ZE-
  const short=code.replace(/^ZE-/,'');
  for(const k of Object.keys(map)){
    const nk=normalizeCode(k).replace(/^ZE-/,'');
    if(nk===short&&map[k]&&map[k].name)return {code:normalizeCode(k),acc:map[k]};
  }
  // 4) سشن فعلی
  try{
    const cur=JSON.parse(localStorage.getItem(K)||'null');
    if(cur&&cur.name){
      if(cur.code&&normalizeCode(cur.code)===code)return {code,acc:cur};
    }
  }catch(e){}
  return null;
}

  }

    if(isOwnerCode(raw)){S=ownerAccount();save();return {ok:1,msg:'ورود مالک'};}

function gen(l){
  const n=tr[l]=(tr[l]??-1)+1,t=[],sl=[];
  const mkWrong=r=>{
    if(D[r])return D[r];
    if(D2[r])return D2[r];
    // غلط واضح بساز
    const map={'س':'ص','ص':'س','ت':'ط','ط':'ت','ز':'ذ','ذ':'ز','غ':'ق','ق':'غ','ه':'ح','ح':'ه','ع':'ا'};
    for(const [a,b] of Object.entries(map)){
      if(r.includes(a))return r.replace(a,b);
    }
    if(r.length>2)return r.slice(0,-1)+'ه';
    return r+'ا';
  };
  const KD=kind(l);
  // جدا کردن با فاصله — نگه داشتن علائم
  const addS=sentence=>sentence.split(/\s+/).forEach(w=>{
    if(!w)return;
    const m=w.match(/^(.*?)\{(.+?)\}(.*)$/);
    if(m){
      const p=m[2].split('|');
      const right=p[0];
      let wrong=p[1]||mkWrong(right);
      if(!wrong||wrong===right)wrong=mkWrong(right);
      if(wrong===right)wrong=right+'ه';
      sl.push(t.length);
      t.push({a:m[1]||'',r:right,w:wrong,b:m[3]||'',bad:0,d:0});
      return;
    }
    const q=w.match(/^([^\u060C\u061B\u06D4.,?!،؛:]+)([\\u060C\\u061B\\u06D4.,?!،؛:]*)$/);
    // simpler punctuation split
    const q2=w.match(/^([^،.؟!:؛]+)([،.؟!:؛]*)$/);
    if(q2&&(D[q2[1]]||D2[q2[1]])){
      const right=q2[1];
      let wrong=D[right]||D2[right]||mkWrong(right);
      if(wrong===right)wrong=mkWrong(right);
      if(wrong===right)wrong=right+'ه';
      sl.push(t.length);
      t.push({a:'',r:right,w:wrong,b:q2[2]||'',bad:0,d:0});
    }else{
      t.push({t:w});
    }
  });
  // اگه جمله‌ی اول به‌اندازه‌ی کافی کلمه‌ی قابل‌غلط نداشت (مثلاً امتحان ۱۰ غلطی)، جمله‌ی بعدی رو هم اضافه می‌کنیم
  for(let k=0;k<8&&(k===0||sl.length<KD.errors);k++)addS(SN[(l-1+n*37+k*53)%SN.length]);
  let need=Math.min(sl.length,KD.errors);
  const picks=sl.slice().sort(()=>Math.random()-.5).slice(0,need);
  picks.forEach(i=>{t[i].bad=1});
  if(!t.some(x=>x.bad)&&sl.length)t[sl[0]].bad=1;
  return t;
}

function renameAccount(code){
  const map=loadAccounts();
  const acc=map[code];
  if(!acc){toast('پیدا نشد');return}
  const n=prompt('اسم جدید اکانت:', acc.name||'');
  if(n===null)return;
  const nn=String(n).trim();
  if(!nn){toast('اسم خالی نباشه');return}
  acc.name=nn.slice(0,16);
  map[code]=acc;
  saveAccounts(map);
  if(S.code&&normalizeCode(S.code)===normalizeCode(code)){S.name=acc.name;save()}
  toast('اسم عوض شد');
  manageAccounts();
}
function deleteOneAccount(code){
  choice('rezaei','این اکانت پاک بشه؟',[
    ['بله حذف کن',()=>{
      const map=loadAccounts();

      saveAccounts(map);

        try{localStorage.removeItem(K)}catch(e){}

    ['نه',()=>0,'#6f84a8']
  ]);
}

H(`${tp('بوفه')}<div class=card>${who('ardeshir',`سلام ${S.name} جان! من اردشیرم، بابای مدرسه. هر چی بخوای دارم.`+(S.freeBuys?` 🎁 ${fa(S.freeBuys)} خرید رایگان داری!`:''))}</div>`+[['p','✏️ مدادها'],['e','🧽 پاک‌کن‌ها'],['n','📓 دفترها'],['f','🖋 خط']].map(([k,t])=>`<div class=card><h3>${t}</h3><div class=g2>${SK[k].map(s=>{const o=S.own[s[0]]||!s[2],sel=S.sk[k]==s[0];return `<button class=it style="${k=='f'?'font-family:'+s[3]+';':''}border-color:${sel?'#43a047':'#ddd'}" onclick="buy('${k}','${s[0]}')"><div style="font-size:28px">${{p:'✏️',e:'🧽',n:'📓',f:'🖋'}[k]}</div>${k=='f'?'<div style="font-size:20px;font-family:'+s[3]+'">نمونه‌ی املا</div>':`<i style="display:inline-block;width:46px;height:14px;border-radius:7px;background:${s[3]};border:1px solid #0004"></i>`}<br>${s[1]}<br>${sel?'✅ انتخاب‌شده':o?'انتخاب':'🪙 '+fa(s[2])}</button>`}).join('')}</div></div>`).join('')+
`<div class=card><h3>👔 اسکین شخصیت‌ها</h3>
<div class=g2>
<button class=it onclick="setSkin('jafari','normal')" style="border-color:${S.skinJafari==='normal'?'#43a047':'#ddd'}">${S.gender==='girl'?'خانم جعفری':'آقای جعفری'}<br>معمولی<br>${S.skinJafari==='normal'?'✅':''}</button>
<button class=it onclick="buySkin('jafari','einstein',567)" style="border-color:${S.skinJafari==='einstein'?'#43a047':'#ddd'}">${S.gender==='girl'?'خانم جعفری':'آقای جعفری'}<br>🧠 انیشتین<br>${S.own&&S.own.skin_j_einstein?(S.skinJafari==='einstein'?'✅ فعال':'انتخاب'):'🪙 ۵۶۷'}</button>
<button class=it onclick="buySkin('jafari','vip',5000)" style="border-color:${S.skinJafari==='vip'?'#43a047':'#ddd'}">${S.gender==='girl'?'خانم جعفری':'آقای جعفری'}<br>⭐ VIP طلایی<br>${S.own&&S.own.skin_j_vip?(S.skinJafari==='vip'?'✅ فعال':'انتخاب'):'🪙 ۵۰۰۰'}</button>
<button class=it onclick="setSkin('modir','normal')" style="border-color:${S.skinModir==='normal'?'#43a047':'#ddd'}">مدیر<br>معمولی<br>${S.skinModir==='normal'?'✅':''}</button>
<button class=it onclick="buySkin('modir','vip',5000)" style="border-color:${S.skinModir==='vip'?'#43a047':'#ddd'}">مدیر<br>⭐ VIP طلایی<br>${S.own&&S.own.skin_m_vip?(S.skinModir==='vip'?'✅ فعال':'انتخاب'):'🪙 ۵۰۰۰'}</button>
</div>
<p style="font-size:12px;margin-top:8px;color:#666">اسکین‌ها پایین‌تر از مداد و دفتر هستن · انیشتین: ۱۰ تقلب رایگان برای ۱۰ مرحله اول</p>
</div>
<div class=card><h3>🥪 خوراکی صداقت</h3><p class="text-sm" style="margin-bottom:8px;color:#555">به‌جای معجون، از بوفه خوراکی بخر و صداقتت رو بالا ببر!</p>
<div class=g2 style="grid-template-columns:1fr 1fr 1fr">
<button class=it onclick="potion(10,150)" style="padding:8px"><img src="${IMG_CAKE}" style="width:100%;border-radius:10px;margin-bottom:4px" alt="cake"><b>کیک دوقلو</b><br><small>صداقت ۱۰٪</small><br>🪙 ${fa(150)}</button>
<button class=it onclick="potion(50,220)" style="padding:8px"><img src="${IMG_CHIPS}" style="width:100%;border-radius:10px;margin-bottom:4px" alt="chips"><b>چیپس نمکی</b><br><small>صداقت ۵۰٪</small><br>🪙 ${fa(220)}</button>
<button class=it onclick="potion(100,300)" style="padding:8px"><img src="${IMG_SANDWICH}" style="width:100%;border-radius:10px;margin-bottom:4px" alt="sandwich"><b>ساندویچ</b><br><small>صداقت ۱۰۰٪</small><br>🪙 ${fa(300)}</button>
</div></div>
<div class=card style="text-align:center"><h3>🎡 گردونه شانس</h3><div class=wh><div id=wh style="background:conic-gradient(#ef5350 0 60deg,#ffca28 0 120deg,#66bb6a 0 180deg,#42a5f5 0 240deg,#ab47bc 0 300deg,#ff7043 0 360deg)">${wl.map((t,i)=>`<b style="transform:translate(-50%,-50%) rotate(${i*60+30}deg) translateY(-62px)">${t}</b>`).join('')}</div><span class=pt>▼</span></div><button class=btn style="background:#ffc928" onclick="spin()">${fr?'🎁 چرخش رایگان':`⏳ ${fa(Math.ceil(left/36e5))} ساعت دیگر · چرخش اضافه ${fa(CFG.extra)} 🪙`}</button></div>${nav('buffet')}`)};
function buy(k,id){
  const s=SK[k].find(x=>x[0]==id);
  if(!s)return;
  if(!s[2]||S.own[id]){S.sk[k]=id;save();ap();R.buffet();return;}
  if((S.freeBuys|0)>0){
    S.freeBuys--;S.own[id]=1;S.sk[k]=id;save();ap();R.buffet();
    toast('🎁 خرید رایگان! باقی‌مانده: '+fa(S.freeBuys));
    return;
  }
  if(S.coins>=s[2]){S.coins-=s[2];S.own[id]=1;S.sk[k]=id;save();ap();try{SND.sfx('buy')}catch(e){}R.buffet();return;}
  say([['ardeshir','سکه‌ت کمه عزیزم! با بردن مرحله‌ها سکه جمع کن.']]);
}
function potion(p,c){
  const names={10:'کیک دوقلو',50:'چیپس نمکی',100:'ساندویچ'};
  const nm=names[p]||'خوراکی';
  if(S.hon>=100)return say([['ardeshir','نوار صداقتت که کامله! '+nm+' لازم نیست 😄']]);
  if(S.coins<c)return say([['ardeshir','سکه‌ت کافی نیست عزیزم!']]);
  S.coins-=c;S.hon=Math.min(100,S.hon+p);save();try{SND.sfx('eat')}catch(e){}
  say([['ardeshir',`نوش جان! ${nm} رو خوردی، صداقتت ${fa(S.hon)}٪ شد.`]],R.buffet);
}
function setSkin(who,id){
  if(who==='jafari'){
    if(id==='normal'){S.skinJafari='normal';save();toast('اسکین معمولی معلم');R.buffet();return}
    if(id==='einstein'&&S.own&&S.own.skin_j_einstein){S.skinJafari='einstein';save();toast('اسکین انیشتین فعال');R.buffet();return}
    if(id==='vip'&&S.own&&S.own.skin_j_vip){S.skinJafari='vip';save();toast('اسکین VIP معلم');R.buffet();return}
  }
  if(who==='modir'){
    if(id==='normal'){S.skinModir='normal';save();toast('اسکین معمولی مدیر');R.buffet();return}
    if(id==='vip'&&S.own&&S.own.skin_m_vip){S.skinModir='vip';save();toast('اسکین VIP مدیر');R.buffet();return}
  }
  toast('هنوز نخریدی‌ش');
}
function buySkin(who,id,price){
  if(!S.own)S.own={};
  const key=who==='jafari'?(id==='einstein'?'skin_j_einstein':'skin_j_vip'):('skin_m_vip');
  if(S.own[key]){setSkin(who,id);return}
  if(S.coins<price)return say([['ardeshir','سکه‌ت کافی نیست! '+fa(price)+' سکه لازمه.']]);
  S.coins-=price;S.own[key]=1;try{SND.sfx('buy')}catch(e){}
  if(who==='jafari'&&id==='einstein'){S.skinJafari='einstein';S.einsteinStagesLeft=10}
  if(who==='jafari'&&id==='vip')S.skinJafari='vip';
  if(who==='modir'&&id==='vip')S.skinModir='vip';
  save();
  say([['ardeshir','خرید شد! اسکین فعال است.'+(id==='einstein'?' ۱۰ تقلب رایگان برای ۱۰ مرحله اول داری.':'')]],R.buffet);
}

function tapModir(){
  // فقط اسکین VIP مدیر — بدون هیچ راهنما
  if(S.skinModir!=='vip')return;
  S.modirTap=(S.modirTap|0)+1;
  S.modirReward=S.modirReward|0;
  if(S.modirReward>=3){save();return}
  if(S.modirTap%10===0){
    S.modirReward++;
    S.coins=(S.coins|0)+5000;
    save();
    toast('🪙 +۵۰۰۰');
    try{R.office()}catch(e){}
  }else save();
}
R.office=()=>{
  const m=dm();
  H(`${tp('اتاق مدیر')}
  <div class=card><div onclick="tapModir()" style="cursor:pointer">${who('modir',`سلام ${S.name}! به اتاق مدیریت خوش اومدی. مأموریت‌ها و رکوردات اینجاست.`)}</div>
  </div>
  <div class=card><h3>📋 مأموریت روزانه</h3>
  ${MS.map((x,i)=>{
    const prog=m.p[x[1]]||0, done=!!m.c[i], ok=prog>=x[2];
    return `<div style="margin:8px 0;padding:10px;background:#f5f7fa;border-radius:12px">
      <b>${x[0]}</b><br>پیشرفت: ${fa(Math.min(prog,x[2]))} / ${fa(x[2])} · جایزه ${fa(x[3])}🪙
      <button class=btn style="margin-top:6px;background:${done?'#9e9e9e':ok?'#4cc13a':'#b0bec5'}" ${done||!ok?'disabled':''} onclick="claim(${i})">${done?'✓ دریافت شد':ok?'دریافت جایزه':'هنوز کامل نیست'}</button>
    </div>`;
  }).join('')}
  </div>
  <div class=card><h3>🏆 رکوردها</h3>
  ${RC.map((r,i)=>`<div style="padding:4px 0">${S.rec[i]?'✅':'⬜'} ${r[0]}${S.rec[i]?'':` — جایزه ${fa(r[3])}🪙`}</div>`).join('')}
  </div>
  <div class=card><h3>📊 وضعیت</h3>
  مرحله: ${fa(S.max)} · برد: ${fa(S.wins)} · سکه: ${fa(S.coins)}<br>
  بدون تقلب: ${fa(S.noCheatWins||0)} · مدال: ${fa(Object.keys(S.medals||{}).length)}
  </div>
  ${nav('office')}`);
};
function claim(i){const m=dm();if(m.c[i])return;m.c[i]=1;S.coins+=MS[i][3];save();toast(`+${fa(MS[i][3])} سکه 🪙`);R.office()}
// ===== شروع =====
function fade(h,cb,bg){
  const d=document.createElement('div');
  d.className='fade';
  if(bg)d.style.background=bg;
  try{d.innerHTML=h}catch(e){d.textContent='زنگ املا 2.0'}
  document.body.appendChild(d);
  setTimeout(()=>{
    try{d.remove()}catch(e){}
    try{cb&&cb()}catch(e){console.error('fade cb',e);try{intro()}catch(e2){}}
  },1800);
}
function intro(){
  const hasProgress=!!(S&&S.name);
  const map=loadAccounts();
  const accKeys=Object.keys(map);
  H(`<div class=board><div>به نام خدا</div><h1>زنگ املا 2.0</h1><div style="font-size:14px;opacity:.9">+۱۰ مناسب برای همه سنین</div></div>
  <div class=card>
    ${hasProgress?who('rezaei',`سلام ${S.name}! می‌تونی مستقیم بری داخل.`):who('rezaei','سلام! دانش‌آموز جدیدی؟ اول بگو پسر هستی یا دختر.')}
    ${hasProgress?`<button class=btn style="background:#4cc13a" onclick="continueAsSaved()">▶ ادامه بازی (${S.name})</button>`:''}
    <button class=btn style="background:#42a5f5" onclick="pickGender('boy')">👦 پسر هستم (جدید)</button>
    <button class=btn style="background:#ec407a" onclick="pickGender('girl')">👧 دختر هستم (جدید)</button>
    <button class=btn style="background:#5c6bc0;margin-top:8px" onclick="showLogin()">ورود با رمز اکانت</button>
    ${accKeys.length?`<p style="font-size:12px;color:#666;text-align:center;margin-top:8px">اکانت‌های ذخیره‌شده: ${accKeys.map(k=>k).join(' · ')}</p>`:''}
  </div>`);
}
function continueAsSaved(){
  if(!S.name){intro();return}
  if(!S.code)S.code=genAccountCode();
  S.code=normalizeCode(S.code)||S.code;
  if(!S.gender)S.gender='boy';
  if(!S.age)S.age=10;
  S.tutored=1;
  save();
  go('home');
}

function pickGender(g){
  S.gender=g;save();
  H(`<div class=board><h1>زنگ املا 2.0</h1></div>
  <div class=card>
    ${who('rezaei',g==='girl'?'عالی! حالا اسمت چیه؟':'باشه! اسمت چیه؟')}
    <input id=nm maxlength=16 placeholder="اسمت رو بنویس..." style="width:100%;padding:12px;font:inherit;font-size:18px;border:2px solid #90a4ae;border-radius:12px;margin-top:8px">
    <button class=btn style="background:#4cc13a" onclick="setName()">ادامه</button>
    <button class=btn style="background:#e3e9f4;color:#2b3a5c;margin-top:8px" onclick="intro()">↩ برگشت</button>
  </div>`);
}
function showLogin(){
  const map=loadAccounts();
  const keys=Object.keys(map);
  let list='';
  keys.forEach(k=>{
    const a=map[k]||{};
    const nm=a.name||'بدون‌نام';
    const st=fa(a.max||0);
    const label=nm+' — مرحله '+st+' — '+k;
    list+=`<button class=btn style="background:#eceff1;color:#333;margin-top:6px;font-size:14px;text-align:right" onclick="quickLogin('${String(k).replace(/'/g,'')}')"><b>${nm}</b><br><small>مرحله ${st} · رمز: ${k}</small></button>`;
  });
  H(`<div class=board><div>ورود به اکانت</div></div>
  <div class=card>
    ${who('rezaei','رمز رو بنویس یا از لیست زیر یکی را انتخاب کن.')}
    <input id=code-in maxlength=24 placeholder="ZE-UWUMN4" autocomplete="off" style="width:100%;padding:12px;font:inherit;font-size:20px;border:2px solid #90a4ae;border-radius:12px;margin-top:8px;direction:ltr;text-align:center;letter-spacing:2px;text-transform:uppercase">
    <button class=btn style="background:#4cc13a" onclick="doLogin()">ورود با رمز</button>
    ${list?`<div style="margin-top:12px"><b>اکانت‌های این دستگاه</b>${list}</div>`:'<p style="color:#888;text-align:center;margin-top:10px">هنوز اکانتی روی این دستگاه ذخیره نشده.</p>'}
    <button class=btn style="background:#e3e9f4;color:#2b3a5c;margin-top:8px" onclick="intro()">↩ برگشت</button>
  </div>`);
  setTimeout(()=>{
    const inp=document.getElementById('code-in');
    if(!inp)return;
    inp.focus();
    inp.onkeydown=e=>{if(e.key==='Enter')doLogin()};
  },100);
}
function quickLogin(code){
  const r=loginWithCode(code);
  if(!r.ok){toast(r.msg);return}
  toast(r.msg);
  go('home');
}
function doLogin(){
  const inp=document.getElementById('code-in');
  const raw=(inp&&inp.value)||(($('#code-in')&&$('#code-in').value)||'');
  if(!String(raw).trim()){toast('اول رمز اکانت رو بنویس');return}
  const r=loginWithCode(raw);
  if(!r.ok){toast(r.msg);return}
  toast(r.msg);
  try{
    say([['rezaei',`خوش برگشتی ${S.name}! همه‌چی سرجاشه.`]],()=>go('home'));
  }catch(e){
    go('home');
  }
}
function setName(){
  const inp=document.getElementById('nm');
  const n=((inp&&inp.value)||($('#nm')&&$('#nm').value)||'').trim();
  if(!n)return toast('اول اسمت رو بنویس!');
  if(!S.gender)S.gender='boy';
  S.name=n;
  if(!S.code)S.code=genAccountCode();
  S.code=normalizeCode(S.code)||S.code;
  S.tutored=0;
  save();
  askAge();
}
function askAge(){
  H(`<div class=board><h1>زنگ املا 2.0</h1></div>
  <div class=card>
    ${who('rezaei',`${S.name} جان، چند سالته؟`)}
    <input id=age-in type=number min=6 max=18 placeholder="مثلاً ۹" style="width:100%;padding:12px;font:inherit;font-size:18px;border:2px solid #90a4ae;border-radius:12px;margin-top:8px">
    <button class=btn style="background:#4cc13a" onclick="setAge()">تأیید</button>
  </div>`);
}
function setAge(){
  const a=parseInt(($('#age-in')&&$('#age-in').value)||'',10);
  if(!a||a<5||a>99)return toast('سن‌ت رو درست بنویس');
  S.age=a;S.tutored=1;save();
  startTutorial();
}
function startTutorial(){
  const n=S.name||'دوست من';
  const code=S.code||'—';
  const hard=S.age>10;
  say([
    ['rezaei',`خوش اومدی ${n}! من خانم رضایی‌ام. این نسخهٔ ۲.۰ زنگ املاست.`],
    ['rezaei',`رمز اکانتت: «${code}». نگهش دار تا بعداً وارد شی.`],
    ['rezaei',hard?'چون سن‌ت بالاتر از ۱۰، متن‌ها کمی بلندتر و سخت‌تر می‌شن.':'چون سن‌ت ۱۰ یا کمتره، متن‌ها کوتاه‌تر و ساده‌تر می‌شن.'],
    ['rezaei','تو هر مرحله همهٔ کلمه‌ها قابل زدنن. فقط غلط‌ها رو بزن؛ اگر درست رو بزنی جانت کم می‌شه.'],
    ['rezaei','سکه بگیر، از بوفه خرید کن، و مواظب نوار صداقت باش. تقلب ممکنه لو بره!'],
    ['rezaei',S.gender==='girl'?'معلم‌ت خانم جعفریه، دوست‌ت لیلاست و نازگل هم هم‌کلاسی درسخونه.':'معلم‌ت آقای جعفریه، دوست‌ت عرفانه و علیرضا هم هم‌کلاسی درسخونه.'],
    ['rezaei',`رمز دوباره: «${code}». حالا بریم سر کلاس!`]
  ],()=>go('home'));
}
// جلوگیری از کپی در کل بازی (به‌جز ورودی‌ها)
document.addEventListener('copy',e=>{const t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'))return;e.preventDefault()},true);
document.addEventListener('cut',e=>{const t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'))return;e.preventDefault()},true);
document.addEventListener('contextmenu',e=>{const t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'))return;e.preventDefault()},true);
try{ap()}catch(e){console.error('ap',e)}
try{fade(`<img src="${LOGO}" alt="Studio Pixel" style="width:min(78vw,380px);border-radius:12px">`,()=>fade('<b>زنگ املا</b><small style="font-size:16px">ساخته شده توسط Studio Pixel</small>',()=>{
  // ورود خودکار اگر قبلاً بازی کرده
  if(S&&S.name){
    if(!S.code)S.code=genAccountCode();
    S.code=normalizeCode(S.code)||S.code;
    if(!S.gender)S.gender='boy';
    if(!S.age)S.age=10;
    if(!S.skinJafari)S.skinJafari='normal';
    if(!S.skinModir)S.skinModir='normal';
    if(!S.medals)S.medals={};
    S.tutored=1;
    try{save()}catch(e){}
    if(S.seenUpdate!==VERSION){
      S.seenUpdate=VERSION;save();
      setTimeout(()=>toast('نسخه جدید زنگ املا منتشر شده است. · نسخه '+VERSION),600);
    }
    go('home');
  }else{
    intro();
  }
},'#102a43'),'#01040f');
}catch(e){console.error('boot',e);try{intro()}catch(e2){document.getElementById('app').innerHTML='<div class=card style="margin:20px"><h2>زنگ املا 2.0</h2><p>خطا در بارگذاری. صفحه را رفرش کن.</p><button class=btn style="background:#4cc13a" onclick="location.reload()">رفرش</button></div>';}}
</script></body></html>
